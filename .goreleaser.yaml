version: 2
project_name: spot-readiness

before:
  hooks:
    - go test ./...

builds:
  - id: spot-readiness
    main: ./cmd/spot-readiness
    binary: spot-readiness
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^chore:", "^test:"]

brews:
  - name: spot-readiness
    repository:
      owner: robertasolimandonofreo
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://www.robertasoliman.com/en/tools/spot-readiness
    description: "Find out which Kubernetes workloads can safely run on Spot"
    license: Apache-2.0
    test: |
      system "#{bin}/spot-readiness", "version"
