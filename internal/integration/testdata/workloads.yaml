apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
apiVersion: v1
kind: Namespace
metadata: {name: karpenter}
---
# A healthy service: replicas, spread, readiness, preStop, requests, a PodDisruptionBudget and an HPA.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: shop}
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: web}}
      containers:
        - name: web
          image: busybox:1.36
          command: ["sleep", "3600"]
          readinessProbe: {exec: {command: ["true"]}}
          lifecycle: {preStop: {exec: {command: ["sleep", "1"]}}}
          resources: {requests: {cpu: 100m, memory: 32Mi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: web, namespace: shop}
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector: {matchLabels: {app: web}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: web, namespace: shop}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}
---
# Replicas come from a KEDA ScaledObject (minReplicaCount 3), the manifest says 2. No probes, no PDB.
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      terminationGracePeriodSeconds: 300
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources: {requests: {cpu: 50m, memory: 32Mi}}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: worker, namespace: shop}
spec:
  scaleTargetRef: {name: worker}
  minReplicaCount: 3
---
# A database run as a Deployment: one replica and a volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: db-data, namespace: shop}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 100Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: db, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
        - name: db
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources: {requests: {cpu: 50m, memory: 32Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: db-data}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: cache, namespace: shop}
spec:
  serviceName: cache
  replicas: 1
  selector: {matchLabels: {app: cache}}
  template:
    metadata: {labels: {app: cache}}
    spec:
      containers:
        - name: cache
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources: {requests: {cpu: 50m, memory: 32Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 100Mi}}
---
# Data on the node: stays on on-demand.
apiVersion: apps/v1
kind: Deployment
metadata: {name: legacy, namespace: shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: legacy}}
  template:
    metadata: {labels: {app: legacy}}
    spec:
      containers:
        - name: legacy
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources: {requests: {cpu: 50m, memory: 32Mi}}
          volumeMounts: [{name: scratch, mountPath: /scratch}]
      volumes:
        - name: scratch
          hostPath: {path: /tmp}
---
apiVersion: batch/v1
kind: Job
metadata: {name: import, namespace: shop}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: import
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources: {requests: {cpu: 50m, memory: 32Mi}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: nightly, namespace: shop}
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: nightly
              image: busybox:1.36
              command: ["true"]
              resources: {requests: {cpu: 50m, memory: 32Mi}}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata: {name: consumer, namespace: shop}
spec:
  jobTargetRef:
    backoffLimit: 6
    template:
      spec:
        restartPolicy: Never
        containers:
          - name: consumer
            image: busybox:1.36
            command: ["true"]
            resources: {requests: {cpu: 50m, memory: 32Mi}}
---
# The Karpenter controller, with an interruption queue (the image is a stand-in).
apiVersion: apps/v1
kind: Deployment
metadata: {name: karpenter, namespace: karpenter}
spec:
  replicas: 2
  selector: {matchLabels: {app: karpenter}}
  template:
    metadata: {labels: {app: karpenter}}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: karpenter}}
      containers:
        - name: controller
          image: busybox:1.36
          command: ["sleep", "3600"]
          env: [{name: INTERRUPTION_QUEUE, value: spot-readiness-it}]
          readinessProbe: {exec: {command: ["true"]}}
          lifecycle: {preStop: {exec: {command: ["sleep", "1"]}}}
          resources: {requests: {cpu: 50m, memory: 32Mi}}
