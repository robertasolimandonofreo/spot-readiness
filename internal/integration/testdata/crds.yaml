# Minimal CRDs for the custom resources the tool reads. They accept any fields, which is enough to
# test how the tool reads a cluster without installing Karpenter, KEDA or Argo Rollouts.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: nodepools.karpenter.sh}
spec:
  group: karpenter.sh
  scope: Cluster
  names: {plural: nodepools, singular: nodepool, kind: NodePool}
  versions:
    - name: v1
      served: true
      storage: true
      schema: {openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}}
---
