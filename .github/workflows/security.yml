name: security
on:
  push:
    branches: [main]
  pull_request:
  # New vulnerabilities are published all the time, so check again every week.
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
