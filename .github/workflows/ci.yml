name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # The race detector needs cgo, which the runner has.
      - run: go test -race ./...
      - run: go run ./cmd/spot-readiness scan testdata
      - run: go run ./cmd/spot-readiness plan testdata

  # action.yml holds a lot of bash (the base commit scan, the checksums, the outputs) and the workflows
  # call it, so both are linted: actionlint for the workflows, shellcheck for the steps of the action.
  lint-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz actionlint
          ./actionlint -color
      - name: shellcheck on the steps of action.yml
        run: go run ./.github/scripts/shellcheck-action

  # The command against a real cluster (kind) and fixtures: the real API server, the custom resource
  # definitions, the owner references of the pods and the labels of the node. The kind version and the
  # node image are pinned, because the output includes the number of objects that the tool skipped.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          cluster_name: spot-readiness-it
      - run: go test -tags integration -count=1 ./internal/integration
        env:
          SPOT_READINESS_CONTEXT: kind-spot-readiness-it
